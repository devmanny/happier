<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 300"> <!-- Frame as an even-odd cutout so the center stays transparent. --> <path fill="#000000" fill-rule="evenodd" clip-rule="evenodd" d="M0 0H240V300H0V0ZM60 60H180V240H60V60Z"/> <!-- Inner bottom fill at low opacity so it reads as a distinct zone in any theme. --> <path fill="#000000" fill-opacity="0.25" d="M60 120H180V240H60V120Z"/> </svg>