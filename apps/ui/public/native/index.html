<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex,nofollow">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
  <title>Open your session · Happier Native</title>
  <style>
    /* Standalone page: OS semantic colors preserve light/dark and forced contrast
       without booting the RN theme runtime or adding a parallel app theme. */
    :root { color-scheme: light dark; font: 100%/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 1.5rem; min-height: 100vh; min-height: 100svh; display: grid; place-items: center; background: Canvas; color: CanvasText; }
    main { width: 100%; max-width: 30rem; padding-block: 2rem; }
    .brand { margin: 0 0 2.5rem; font-weight: 650; }
    h1 { margin: 0 0 .75rem; font-size: clamp(2rem, 6vw, 2.75rem); line-height: 1.15; letter-spacing: -.035em; text-wrap: balance; }
    p { margin: 0 0 1.5rem; }
    .context { margin-block: 2rem; border-block: 1px solid GrayText; padding-block: 1rem; }
    .context dt { font-size: .875rem; font-weight: 650; }
    .context dd { margin: .25rem 0 0; overflow-wrap: anywhere; }
    .actions { display: grid; gap: .75rem; }
    .action { display: grid; place-items: center; min-height: 3rem; padding: .75rem 1rem; border: 1px solid CanvasText; border-radius: .75rem; color: CanvasText; text-decoration: none; text-align: center; font-weight: 650; }
    .primary { background: CanvasText; color: Canvas; }
    .action[aria-disabled="true"] { background: Canvas; color: GrayText; border-color: GrayText; cursor: default; }
    .action:focus-visible { outline: 3px solid Highlight; outline-offset: 4px; }
    .action[href]:active { transform: translateY(1px); }
    .note { margin: 1.5rem 0 0; font-size: .875rem; }
    #link-error { border-inline-start: .2rem solid CanvasText; padding-inline-start: 1rem; margin-block: 2rem; }
    [hidden] { display: none !important; }
    @media (prefers-reduced-motion: reduce) { .action[href]:active { transform: none; } }
  </style>
  <script type="module" src="./landing.js"></script>
</head>
<body>
  <main>
    <p class="brand">Happier Native</p>
    <h1>Open your session</h1>
    <p>Pick up where you left off, in the app or your browser.</p>
    <dl class="context" id="relay-context" hidden>
      <dt>Relay</dt>
      <dd id="relay"></dd>
    </dl>
    <p id="link-error" role="alert" hidden></p>
    <div class="actions" aria-label="Open session">
      <a class="action primary" id="open-native" role="link" aria-disabled="true" tabindex="-1">Open in Happier Native</a>
      <a class="action" id="continue-browser" role="link" aria-disabled="true" tabindex="-1">Continue in Browser</a>
    </div>
    <p class="note">If you need to sign in, return to this link afterward to open the session.</p>
    <noscript><p class="note">Enable JavaScript to open this session link.</p></noscript>
  </main>
</body>
</html>
